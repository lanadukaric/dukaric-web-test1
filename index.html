<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Vorname Nachname – Klasse</title>
</head>

<body style="background-color: lightblue;">

    <h1>Vorname Nachname – Klasse</h1>

    <h2>Persönliche Daten</h2>
    <p>
        Geburtsdatum: 01.01.2010<br>
        Lieblingsfarbe: lightblue
    </p>

    <h2>Meine Lieblingsfächer</h2>
    <ol>
        <li>Mathematik</li>
        <li>Sport</li>
        <li>Informatik</li>
    </ol>
 <h2>Meine Hobbys</h2>
    <ul id="liste-hobbys"></ul>

    <h2>Freies Bild</h2>
    <figure>
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" width="300" alt="Naturbild">
        <figcaption>Natur</figcaption>
    </figure>
    <!-- JavaScript -->
    <script>
        const hobbys = ["Fußball", "Gaming", "Musik"];  
        const liste = document.getElementById("liste-hobbys");

        hobbys.forEach(h => {
            let li = document.createElement("li");
            li.textContent = h;
            liste.appendChild(li);
        });
    </script>

</body>
</html>
