<!DOCTYPE html>
<html lang="de">
<head>

    <title>Vorname Nachname – Klasse</title>

<body style="background-color: lightblue;">

    <h1>Vorname Nachname – Klasse</h1>

    <h2>Persönliche Daten</h2>
    <p>
        Geburtsdatum: 01.01.2010<br>
        Lieblingsfarbe: lightblue

    <h2>Meine Lieblingsfächer</h2>
    <ol>
        <li>Mathematik</li>

    </ol>
 <h2>Meine Hobbys</h2>

        <img src="img/bild1.jpg" width="400" alt="Beschreibung des Bildinhalts" title="Freies Bild">

            </a>

    <script>
        const hobbys = ["Zeichnen", "Laufen", "Spazieren", "Lana Dukaric"];

        const liste = document.getElementById("liste-hobbys");

        hobbys.forEach(h => {
            let li = document.createElement("li");

        });
