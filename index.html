<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Vorname Nachname – Klasse</title>
</head>

<body style="background-color: lightblue;">

    <h1>Vorname Nachname – Klasse</h1>

    <h2>Persönliche Daten</h2>
    <p>
        Geburtsdatum: 01.01.2010<br>
        Lieblingsfarbe: lightblue
    </p>

     <h2>Meine Hobbys</h2>
    <ul id="liste-hobbys"></ul>

    <h2>Freies Bild</h2>
    <figure>
        <img src="bild.jpg" alt="Mein Bild" width="300">
        <figcaption>Beschreibung des Bildes</figcaption>
    </figure>

    <!-- JavaScript -->
    <script>
        const hobbys = ["Fußball", "Gaming", "Musik", "DeinName"];  
        const liste = document.getElementById("liste-hobbys");

        hobbys.forEach(h => {
            let li = document.createElement("li");
            li.textContent = h;
            liste.appendChild(li);
    </figure>

</body>
</html>
